<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEDEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>宝石消消乐</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Design plan
   Color: cool neutral greys + one teal accent; six gem hues fixed across themes
   Type: ZCOOL QingKe HuangYou (display/numbers), Noto Sans SC (UI text)
   Layout: single centered column, HUD row, square tray board */
:root{
  --bg:#ECEDEE;
  --panel:#FAFAF9;
  --board:#DCE0E1;
  --grid:rgba(31,34,36,.06);
  --cell-halo:rgba(31,34,36,.010);
  --ink:#1F2224;
  --ink-dim:#6B7175;
  --line:rgba(31,34,36,.12);
  --accent:#0E6B5C;
  --accent-soft:rgba(14,107,92,.16);
  --accent-ink:#F7FBF9;
  --shadow:0 20px 44px -24px rgba(31,34,36,.55);
  --g1:#F0A43C; --g2:#E0516E; --g3:#3FAF8C;
  --g4:#4C8FE6; --g5:#9C6BE6; --g6:#8A94A3;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131518; --panel:#1B1E22; --board:#23272B;
    --grid:rgba(237,233,223,.06); --cell-halo:rgba(255,255,255,.02);
    --ink:#ECEAE4; --ink-dim:#9AA1A6; --line:rgba(237,233,223,.13);
    --accent:#4FC3A9; --accent-soft:rgba(79,195,169,.18); --accent-ink:#0B211C;
    --shadow:0 24px 50px -26px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131518; --panel:#1B1E22; --board:#23272B;
  --grid:rgba(237,233,223,.06); --cell-halo:rgba(255,255,255,.02);
  --ink:#ECEAE4; --ink-dim:#9AA1A6; --line:rgba(237,233,223,.13);
  --accent:#4FC3A9; --accent-soft:rgba(79,195,169,.18); --accent-ink:#0B211C;
  --shadow:0 24px 50px -26px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  background:var(--bg); color:var(--ink);
  font-family:'Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  overscroll-behavior-y:contain;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding-block:clamp(20px,5vw,44px) max(28px,env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:18px;
}
/* 手机上 .side 透明化，标题+HUD 直接作为 .wrap 的子项纵向排列 */
.side{display:contents}
.head h1{
  font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',system-ui,sans-serif;
  font-weight:400;font-size:clamp(26px,7.5vw,38px);line-height:1.1;
  margin:0 0 6px;letter-spacing:.03em;
  text-wrap:balance;
}
.head p{margin:0;color:var(--ink-dim);font-size:13.5px;max-width:34ch}
.head{flex:0 0 auto}
.hud{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;flex:0 0 auto}
.stat{
  flex:1 1 84px;min-width:0;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:8px 12px 9px;display:flex;flex-direction:column;gap:1px;
}
.k{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);font-weight:500}
.stat strong{
  font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;font-weight:400;
  font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.btn{
  font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:0 18px;min-height:44px;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;
  flex:0 0 auto;white-space:nowrap;
}
.btn:hover{background:var(--accent-soft);border-color:transparent}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* shell 吃掉剩余视口高度；棋盘尺寸由脚本按 shell 的实际宽高取较小值设定，
   竖屏占满屏宽，横屏/矮屏自动缩小，底部不留大片空白 */
.shell{
  position:relative;width:100%;flex:1 1 auto;
  min-height:min(240px,55vh);
  display:flex;align-items:center;justify-content:center;
}
.tray{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;max-height:100%}
.board{
  position:absolute;inset:0;width:100%;height:100%;
  background:var(--board);border-radius:22px;overflow:hidden;
  background-image:
    linear-gradient(to right,var(--grid) 1px,transparent 1px),
    linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:12.5% 12.5%;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.07),var(--shadow);
  user-select:none;-webkit-user-select:none;touch-action:none;
  --unused:0;
}
.board.shuffle{animation:pulse .45s ease}
@keyframes pulse{50%{opacity:.45}}
.tile{
  position:absolute;top:0;left:0;width:12.5%;height:12.5%;
  transition:transform .22s cubic-bezier(.3,.9,.4,1);will-change:transform;
}
.tile.sel::before{
  content:"";position:absolute;inset:7%;border-radius:34%;
  background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);
}
.gem{
  position:absolute;inset:11%;background-color:var(--c);
  background-image:linear-gradient(160deg,rgba(255,255,255,.38),rgba(255,255,255,0) 46%,rgba(0,0,0,.14));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),inset 0 2px 0 rgba(255,255,255,.22);
  transition:transform .18s,opacity .18s,filter .1s;cursor:pointer;
}
.tile.sel .gem{transform:scale(1.06);filter:brightness(1.1)}
.gem.t0{--c:var(--g1);border-radius:28%}
.gem.t1{--c:var(--g2);border-radius:50%}
.gem.t2{--c:var(--g3);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.gem.t3{--c:var(--g4);clip-path:polygon(50% 2%,98% 50%,50% 98%,2% 50%)}
.gem.t4{--c:var(--g5);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.gem.t5{--c:var(--g6);border-radius:50%;background-image:radial-gradient(circle,transparent 0 30%,rgba(255,255,255,.32) 31% 36%,transparent 37%),linear-gradient(160deg,rgba(255,255,255,.35),rgba(0,0,0,.12))}
.tile.clearing .gem{transform:scale(.15);opacity:0}
.overlay{
  position:absolute;inset:0;display:grid;place-items:center;border-radius:22px;
  background:color-mix(in srgb,var(--bg) 68%,transparent);backdrop-filter:blur(7px);
}
.card{text-align:center;padding:26px 30px}
.card .k{letter-spacing:.2em}
.final{
  font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;font-size:56px;line-height:1.05;
  margin:6px 0 2px;font-variant-numeric:tabular-nums;
}
.sub{margin:0 0 18px;color:var(--ink-dim);font-size:13.5px}
.btn-solid{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-solid:hover{background:var(--accent);filter:brightness(1.07)}
/* 窄屏：HUD 两行，字号收紧 */
@media (max-width: 400px){
  .wrap{gap:14px;padding-block:16px max(24px,env(safe-area-inset-bottom,0px))}
  .head p{font-size:12.5px}
  .hud{gap:8px}
  .stat{flex:1 1 calc(33.333% - 6px);padding:6px 10px 7px}
  .stat strong{font-size:21px}
  .btn{padding:0 14px;font-size:13px}
  #restart{flex:1 1 100%;min-height:40px}
  .shell{min-height:min(200px,50vh)}
}
/* 矮屏（横屏手机）：压缩上下留白，棋盘跟视口高度走 — 见文末统一断点 */
@media (prefers-reduced-motion: reduce){
  .tile,.gem,.btn{transition-duration:.01s}
  .board.shuffle{animation:none}
}
/* 平板竖屏：单栏加宽，避免棋盘偏小 */
@media (min-width: 600px) and (max-width: 899px){
  .wrap{max-width:min(600px,calc(100vw - 64px));gap:20px}
  .head p{font-size:14px}
}
/* 宽屏（PC / 平板横屏 / 手机横屏）：左侧信息栏 + 右侧棋盘的双栏布局 */
@media (min-width: 900px), (min-width: 640px) and (max-height: 600px) and (orientation: landscape){
  body{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  .wrap{
    max-width:1040px;height:100vh;height:100dvh;
    display:grid;grid-template-columns:minmax(232px,300px) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr);align-items:center;
    column-gap:clamp(28px,4vw,56px);
    padding-block:clamp(24px,4vh,48px) max(clamp(24px,4vh,48px),env(safe-area-inset-bottom,0px));
  }
  .side{display:flex;flex-direction:column;gap:clamp(16px,2.6vh,30px);min-width:0}
  .head h1{font-size:clamp(26px,3vw,44px);margin-bottom:10px}
  .head p{font-size:14px;max-width:30ch}
  .hud{flex-direction:column;gap:10px}
  .stat{flex:0 0 auto;padding:9px 14px 10px}
  .stat strong{font-size:26px}
  #restart{width:100%;min-height:46px}
  .shell{height:100%;min-height:0;flex:none;align-self:stretch}
  .card{padding:30px 36px}
}
/* 大屏 PC：棋盘放大一点上限，但不超过可视高度 */
@media (min-width: 1440px){
  .wrap{max-width:1180px;grid-template-columns:minmax(260px,340px) minmax(0,1fr)}
  .head h1{font-size:46px}
  .stat strong{font-size:28px}
}
/* 手机横屏等矮屏：压缩留白（与双栏布局叠加时也生效） */
@media (max-height: 560px){
  .wrap{gap:10px;padding-block:12px 16px}
  .head h1{font-size:22px;margin-bottom:2px}
  .head p{display:none}
  .stat strong{font-size:20px}
  .btn{min-height:38px}
  .shell{min-height:min(180px,50vh)}
  .card{padding:18px 22px}
  .final{font-size:44px}
}
@media (max-height: 560px) and (min-width: 900px),
       (max-height: 560px) and (min-width: 640px) and (orientation: landscape){
  .wrap{padding-block:14px}
  .side{gap:12px}
  .hud{gap:8px}
  .stat{padding:6px 12px 7px}
  .head h1{font-size:24px;margin-bottom:0}
}
</style>

<div class="wrap">
  <div class="side">
    <header class="head">
      <h1>宝石消消乐</h1>
      <p>交换相邻的宝石，横竖连成三颗即可消除。25 步之内拿到最高分。</p>
    </header>

    <div class="hud">
      <div class="stat"><span class="k">分数</span><strong id="score">0</strong></div>
      <div class="stat"><span class="k">步数</span><strong id="moves">25</strong></div>
      <div class="stat"><span class="k">最佳</span><strong id="best">0</strong></div>
      <button id="restart" class="btn" type="button">重开</button>
    </div>
  </div>

  <div class="shell">
    <div class="tray">
      <div class="board" id="board" aria-label="8 乘 8 消消乐棋盘"></div>
      <div class="overlay" id="overlay" hidden>
      <div class="card">
        <p class="k">本局结束</p>
        <p class="final" id="finalScore">0</p>
        <p class="sub" id="finalNote">再来一局？</p>
        <button id="again" class="btn btn-solid" type="button">再来一局</button>
      </div>
    </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const N = 8, TYPES = 6, START_MOVES = 25;
  const boardEl   = document.getElementById('board');
  const scoreEl   = document.getElementById('score');
  const movesEl   = document.getElementById('moves');
  const bestEl    = document.getElementById('best');
  const overlay   = document.getElementById('overlay');
  const finalEl   = document.getElementById('finalScore');
  const finalNote = document.getElementById('finalNote');
  const shellEl   = document.querySelector('.shell');
  const trayEl    = document.querySelector('.tray');

  /* 棋盘尺寸 = shell 可用宽高中较小的那个，保证正方形且不溢出；
     宽屏双栏布局下 cap 上限，避免超宽显示器上棋盘过大 */
  function fitTray(){
    const wide = getComputedStyle(document.querySelector('.wrap')).display === 'grid';
    const cap = wide ? 760 : Infinity;
    const w = shellEl.clientWidth;
    const h = shellEl.clientHeight;
    const size = Math.max(0, Math.floor(Math.min(w, h, cap)));
    trayEl.style.width = size + 'px';
    trayEl.style.height = size + 'px';
  }
  let fitRaf = 0;
  function scheduleFit(){
    if (fitRaf) cancelAnimationFrame(fitRaf);
    fitRaf = requestAnimationFrame(function(){ fitRaf = 0; fitTray(); });
  }
  window.addEventListener('resize', scheduleFit);
  window.addEventListener('orientationchange', scheduleFit);
  if ('ResizeObserver' in window){
    new ResizeObserver(scheduleFit).observe(shellEl);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleFit);
  }

  let cells = [];            // flat array of {id, type} | null
  let elById = new Map();    // id -> .tile element
  let selected = null;       // index or null
  let busy = false;
  let score = 0, moves = START_MOVES;
  let nextId = 1;

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const randType = () => Math.floor(Math.random() * TYPES);
  const idx = (r, c) => r * N + c;
  const rowOf = i => Math.floor(i / N);
  const colOf = i => i % N;

  /* ---------- persistence ---------- */
  function loadBest(){
    try { return Number(localStorage.getItem('gem-tray-best')) || 0; } catch(e){ return 0; }
  }
  function saveBest(v){
    try { localStorage.setItem('gem-tray-best', String(v)); } catch(e){}
  }
  let best = loadBest();

  /* ---------- board construction ---------- */
  function wouldMatch(r, c, type, arr){
    const at = (rr, cc) => {
      if (rr < 0 || cc < 0 || rr >= N || cc >= N) return -1;
      const cell = arr[idx(rr, cc)];
      return cell ? cell.type : -1;
    };
    if (c >= 2 && at(r, c-1) === type && at(r, c-2) === type) return true;
    if (r >= 2 && at(r-1, c) === type && at(r-2, c) === type) return true;
    return false;
  }

  function buildBoard(){
    cells = new Array(N * N).fill(null);
    for (let r = 0; r < N; r++){
      for (let c = 0; c < N; c++){
        let t, guard = 0;
        do { t = randType(); guard++; } while (wouldMatch(r, c, t, cells) && guard < 60);
        cells[idx(r, c)] = { id: nextId++, type: t };
      }
    }
    elById.forEach(el => el.remove());
    elById.clear();
    for (let i = 0; i < N * N; i++){
      const el = makeTileEl(cells[i]);
      positionTile(el, i);
      boardEl.appendChild(el);
    }
  }

  function makeTileEl(cell){
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.id = String(cell.id);
    const gem = document.createElement('div');
    gem.className = 'gem t' + cell.type;
    el.appendChild(gem);
    elById.set(cell.id, el);
    return el;
  }

  function positionTile(el, i, rowOverride){
    const r = rowOverride === undefined ? rowOf(i) : rowOverride;
    const c = colOf(i);
    el.style.transform = 'translate(' + (c * 100) + '%,' + (r * 100) + '%)';
  }

  function layout(){
    for (let i = 0; i < N * N; i++){
      const cell = cells[i];
      if (!cell) continue;
      const el = elById.get(cell.id);
      if (el) positionTile(el, i);
    }
  }

  /* ---------- matching ---------- */
  function findMatches(){
    const m = new Set();
    for (let r = 0; r < N; r++){
      let run = 1;
      for (let c = 1; c <= N; c++){
        const same = c < N && cells[idx(r,c)] && cells[idx(r,c-1)] &&
                     cells[idx(r,c)].type === cells[idx(r,c-1)].type;
        if (same) run++;
        else {
          if (run >= 3) for (let k = c - run; k < c; k++) m.add(idx(r, k));
          run = 1;
        }
      }
    }
    for (let c = 0; c < N; c++){
      let run = 1;
      for (let r = 1; r <= N; r++){
        const same = r < N && cells[idx(r,c)] && cells[idx(r-1,c)] &&
                     cells[idx(r,c)].type === cells[idx(r-1,c)].type;
        if (same) run++;
        else {
          if (run >= 3) for (let k = r - run; k < r; k++) m.add(idx(k, c));
          run = 1;
        }
      }
    }
    return m;
  }

  function swapCells(a, b){
    const t = cells[a]; cells[a] = cells[b]; cells[b] = t;
  }

  function adjacent(a, b){
    return Math.abs(rowOf(a) - rowOf(b)) + Math.abs(colOf(a) - colOf(b)) === 1;
  }

  function swapMakesMatch(a, b){
    swapCells(a, b);
    const ok = findMatches().size > 0;
    swapCells(a, b);
    return ok;
  }

  function hasMove(){
    for (let r = 0; r < N; r++){
      for (let c = 0; c < N; c++){
        const i = idx(r, c);
        if (c < N - 1 && swapMakesMatch(i, i + 1)) return true;
        if (r < N - 1 && swapMakesMatch(i, i + N)) return true;
      }
    }
    return false;
  }

  /* ---------- gravity ---------- */
  function collapse(){
    const spawns = [];
    for (let c = 0; c < N; c++){
      const stack = [];
      for (let r = N - 1; r >= 0; r--){
        const cell = cells[idx(r, c)];
        if (cell) stack.push(cell);
      }
      for (let r = N - 1; r >= 0; r--){
        cells[idx(r, c)] = stack[N - 1 - r] || null;
      }
      const empty = N - stack.length;
      for (let r = 0; r < empty; r++){
        const cell = { id: nextId++, type: randType() };
        cells[idx(r, c)] = cell;
        spawns.push({ i: idx(r, c), from: r - empty });
      }
    }
    layout();
    for (const s of spawns) spawnTile(s.i, s.from);
  }

  function spawnTile(i, fromRow){
    const cell = cells[i];
    const el = makeTileEl(cell);
    el.style.transition = 'none';
    positionTile(el, i, fromRow);
    boardEl.appendChild(el);
    void el.offsetWidth;
    el.style.transition = '';
    positionTile(el, i);
  }

  /* ---------- resolution loop ---------- */
  async function resolve(){
    let combo = 0;
    while (true){
      const m = findMatches();
      if (m.size === 0) break;
      combo++;
      score += m.size * 10 * combo;
      updateHud();
      m.forEach(i => {
        const cell = cells[i];
        if (!cell) return;
        const el = elById.get(cell.id);
        if (el) el.classList.add('clearing');
      });
      await wait(200);
      m.forEach(i => {
        const cell = cells[i];
        if (!cell) return;
        const el = elById.get(cell.id);
        if (el) el.remove();
        elById.delete(cell.id);
        cells[i] = null;
      });
      collapse();
      await wait(240);
    }
    if (!hasMove()) await shuffleBoard();
  }

  async function shuffleBoard(){
    for (let attempt = 0; attempt < 40; attempt++){
      const types = cells.filter(Boolean).map(c => c.type);
      for (let i = types.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        const t = types[i]; types[i] = types[j]; types[j] = t;
      }
      let k = 0;
      for (let i = 0; i < N * N; i++){
        if (cells[i]) cells[i].type = types[k++];
      }
      if (findMatches().size === 0 && hasMove()) break;
    }
    for (let i = 0; i < N * N; i++){
      const cell = cells[i];
      if (!cell) continue;
      const el = elById.get(cell.id);
      if (!el) continue;
      el.firstChild.className = 'gem t' + cell.type;
    }
    boardEl.classList.add('shuffle');
    await wait(460);
    boardEl.classList.remove('shuffle');
  }

  /* ---------- input ---------- */
  function indexOfId(id){
    for (let i = 0; i < N * N; i++){
      if (cells[i] && cells[i].id === id) return i;
    }
    return -1;
  }

  function select(i){
    selected = i;
    boardEl.querySelectorAll('.tile.sel').forEach(el => el.classList.remove('sel'));
    if (i !== null && i !== undefined){
      const cell = cells[i];
      const el = cell && elById.get(cell.id);
      if (el) el.classList.add('sel');
    }
  }

  async function trySwap(a, b){
    if (busy) return;
    busy = true;
    select(null);
    swapCells(a, b);
    layout();
    await wait(215);
    if (findMatches().size === 0){
      swapCells(a, b);
      layout();
      await wait(215);
      busy = false;
      return;
    }
    moves--;
    updateHud();
    await resolve();
    busy = false;
    if (moves <= 0) endGame();
  }

  let drag = null;

  boardEl.addEventListener('pointerdown', function(e){
    if (busy) return;
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const i = indexOfId(Number(tile.dataset.id));
    if (i < 0) return;
    drag = { i: i, x: e.clientX, y: e.clientY };
    if (selected === null){
      select(i);
    } else if (selected === i){
      select(null);
    } else if (adjacent(selected, i)){
      const s = selected;
      drag = null;
      trySwap(s, i);
    } else {
      select(i);
    }
  });

  window.addEventListener('pointermove', function(e){
    if (!drag || busy) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    const r = rowOf(drag.i), c = colOf(drag.i);
    let nr = r, nc = c;
    if (Math.abs(dx) > Math.abs(dy)) nc += dx > 0 ? 1 : -1;
    else nr += dy > 0 ? 1 : -1;
    drag = null;
    if (nr < 0 || nr >= N || nc < 0 || nc >= N){ select(null); return; }
    trySwap(idx(r, c), idx(nr, nc));
  });

  window.addEventListener('pointerup', function(){ drag = null; });
  window.addEventListener('pointercancel', function(){ drag = null; });

  /* ---------- hud & game flow ---------- */
  function updateHud(){
    scoreEl.textContent = score.toLocaleString('en-US');
    movesEl.textContent = String(Math.max(0, moves));
    bestEl.textContent = Math.max(best, score).toLocaleString('en-US');
  }

  function start(){
    score = 0;
    moves = START_MOVES;
    selected = null;
    busy = false;
    drag = null;
    overlay.hidden = true;
    fitTray();
    buildBoard();
    updateHud();
    if (!hasMove()) shuffleBoard();
  }

  function endGame(){
    if (score > best){
      best = score;
      saveBest(best);
    }
    updateHud();
    finalEl.textContent = score.toLocaleString('en-US');
    finalNote.textContent = score >= best && score > 0
      ? '新纪录。再来一局？'
      : '本局最佳 ' + best.toLocaleString('en-US') + '。再来一局？';
    overlay.hidden = false;
  }

  document.getElementById('restart').addEventListener('click', start);
  document.getElementById('again').addEventListener('click', start);

  start();
})();
</script>
